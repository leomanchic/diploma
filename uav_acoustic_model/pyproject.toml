[build-system]
requires = ["setuptools>=68", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-acoustic-model"
version = "0.1.0"
description = "Reproducible multi-station acoustic bearing and 3D UAV localization model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbconvert>=7.8",
    "nbformat>=5.9",
    "ipykernel>=6.25",
    "ipywidgets>=8.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "estimators*", "simulation*", "validation*", "visualization*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
