name: S7B cross-platform numerical gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-gate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: uav_acoustic_model

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uav_acoustic_model/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check whitespace errors
        run: git diff --check
