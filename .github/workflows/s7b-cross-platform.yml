name: S7B cross-platform numerical gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-gate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        working-directory: uav_acoustic_model

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uav_acoustic_model/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: >-
          python -c "import subprocess,sys;
          completed=subprocess.run([sys.executable,'-m','pytest','-q'],text=True,capture_output=True);
          print(completed.stdout,end='');print(completed.stderr,end='',file=sys.stderr);
          diagnostic='\n'.join((completed.stdout+'\n'+completed.stderr).splitlines()[-120:]);
          escaped=diagnostic.replace('%','%25').replace('\r','%0D').replace('\n','%0A');
          print('::error title=pytest failure::'+escaped) if completed.returncode else None;
          raise SystemExit(completed.returncode)"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check branch diff for whitespace errors
        run: git diff --check origin/main...HEAD
